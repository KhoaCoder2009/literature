<!-- SCREEN 5: WRITING PRACTICE (LUYỆN VIẾT) -->
<section id="s-writing" class="scr">
  <div class="wrap writing-wrap">

    <!-- VIEW 1: DANH SÁCH BỘ ĐỀ LUYỆN VIẾT -->
    <div id="writing-list-view">
      <!-- Cartoon Hero Banner -->
      <div class="writing-hero-banner">
        <div class="writing-hero-content">
          <h1 style="font-size:clamp(22px, 3.5vw, 28px); margin:0 0 4px; font-weight:800;">Luyện viết văn theo dàn ý</h1>
          <p class="writing-hero-desc">Rèn luyện kỹ năng viết văn theo cấu trúc mở bài, thân bài, kết bài và các dạng đề chuẩn.</p>
        </div>
      </div>

      <!-- Action & Filters Bar -->
      <div class="writing-control-bar card">
        <div class="writing-control-top">
          <div class="writing-search-box" style="flex:1;">
            <span class="writing-search-icon">🔍</span>
            <input type="text" id="writing-search-input" placeholder="Tìm kiếm bộ đề theo tên, dạng đề hoặc chủ đề..." oninput="onWritingSearchInput()">
          </div>
        </div>

        <div class="writing-category-filter">
          <div class="writing-filter-chips-wrap">
            <span class="writing-filter-label">Chủ đề:</span>
            <div class="writing-category-chips" id="writing-category-chips"></div>
          </div>
          <div class="writing-category-actions">
            <button class="btn cy sm" type="button" onclick="promptAddNewCategory()" title="Tạo thêm chủ đề mới">
              + Thêm chủ đề
            </button>
            <button class="btn no sm" type="button" onclick="promptDeleteCurrentCategory()" title="Xóa chủ đề (có xác nhận)">
              ✕ Xóa chủ đề
            </button>
            <button class="btn au sm" type="button" onclick="openCreateWritingSetModal()" title="Tạo bộ đề mới">
              + Thêm bộ mới
            </button>
          </div>
        </div>
      </div>

      <!-- Container danh sách các bộ đề (sắp xếp và gom nhóm theo chủ đề) -->
      <div id="writing-sets-container"></div>
    </div>

    <!-- VIEW 2: PHÒNG LUYỆN VIẾT (SPLIT SCREEN WORKSPACE) -->
    <div id="writing-workspace-view" style="display:none;">
      <!-- Workspace Navigation Bar -->
      <div class="writing-workspace-nav">
        <button class="btn gh sm" onclick="exitWritingWorkspace()">
          <span>←</span> <span>Trở về danh sách đề</span>
        </button>
        <div class="writing-workspace-title-box">
          <h3 id="workspace-set-title">Đề bài luyện viết</h3>
          <span id="workspace-set-badge" class="tag ok">Nghị luận xã hội</span>
        </div>
        <div class="writing-workspace-actions" style="display:flex; align-items:center; gap:8px;">
          <button class="btn cy sm" onclick="editWritingSet(window.currentWritingSetId || (currentWritingSet && currentWritingSet.id))" title="Chỉnh sửa đề bài và dàn ý">
            <span>✏️</span> <span>Sửa đề</span>
          </button>
          <button class="btn no sm" onclick="deleteCurrentOpenedWritingSet()" title="Xóa đề này khỏi danh sách">
            <span>🗑️</span> <span>Xóa đề</span>
          </button>
        </div>
      </div>

      <!-- Split Layout Container -->
      <div class="writing-split-container" id="writing-split-container">
        
        <!-- LEFT PANEL: Đề bài & Dàn ý ngữ liệu -->
        <div class="writing-left-panel" id="writing-left-panel">
          <div class="writing-panel-scroll">
            
            <!-- Hộp đề bài -->
            <div class="writing-prompt-card">
              <div class="writing-prompt-header" style="display:flex; justify-content:space-between; align-items:center;">
                <span class="writing-prompt-tag">Đề bài</span>
                <button type="button" class="btn cy sm" onclick="editWritingSet(window.currentWritingSetId || (currentWritingSet && currentWritingSet.id))" title="Chỉnh sửa nội dung đề bài" style="padding:2px 8px; font-size:12px; height:26px;">
                  ✏️ Sửa đề
                </button>
              </div>
              <div class="writing-prompt-text-wrapper">
                <p id="workspace-prompt-text" class="writing-prompt-text"></p>
                <button type="button" id="workspace-prompt-toggle-btn" class="writing-prompt-toggle" onclick="togglePromptExpand()">Xem thêm</button>
              </div>
            </div>

            <!-- Hộp Dàn ý tham khảo -->
            <div class="writing-outline-card" id="workspace-outline-card">
              <div class="writing-outline-header">
                <span>Dàn ý</span>
              </div>
              <div class="writing-outline-content" id="workspace-outline-content"></div>
            </div>

          </div>
        </div>

        <!-- RESIZE SPLITTER / DIVIDER -->
        <div class="writing-splitter" id="writing-splitter" title="Kéo để thay đổi độ rộng 2 cột">
          <div class="writing-splitter-handle"></div>
        </div>

        <!-- RIGHT PANEL: Không gian viết bài theo từng phần bài viết -->
        <div class="writing-right-panel" id="writing-right-panel">
          
          <!-- Header thanh công cụ phải -->
          <div class="writing-editor-header">
            <span style="font-size:14px; font-weight:800; color:var(--ink);">✍️ Bài làm</span>
            <div class="writing-word-count-badge">
              Tổng số từ: <b id="workspace-total-words">0</b>
            </div>
          </div>

          <!-- Danh sách các ô viết theo từng phần của Dàn ý -->
          <div class="writing-sections-list" id="writing-sections-list"></div>

          <!-- Bottom Sticky Action Bar -->
          <div class="writing-bottom-bar">
            <div class="writing-timer-box">
              <span class="writing-timer-icon">⏱️</span>
              <span class="writing-timer-label">Thời gian:</span>
              <b class="writing-timer-value" id="workspace-timer-display">00:00:00</b>
              <button class="writing-timer-btn" id="workspace-timer-btn" onclick="toggleWritingTimer()" title="Tạm dừng / Tiếp tục">⏸</button>
            </div>

            <div class="writing-bottom-buttons">
              <button class="writing-btn-review" type="button" onclick="openWritingReviewModal()">
                <span>Xem &amp; Xuất bài</span>
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>
</section>
