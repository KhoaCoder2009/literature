<!-- SCREEN 1: HOME -->
<section id="s-home" class="scr">
  <div class="wrap">
    <!-- HERO SHOWCASE: NHẬN ĐỊNH VĂN HỌC & TRUYỀN CẢM HỨNG -->
    <div class="hero-showcase" id="hero-showcase">
      <div class="hero-study-card" id="hero-study-card">
        <div class="study-card-img-wrap" id="study-img-wrap">
          <img class="study-card-img" id="study-img" src="./assets/gorki.jpg" alt="M. Gorki">
        </div>
        <div class="study-card-content" id="study-content">
          <div class="study-quote-tag" id="study-tag">LÝ LUẬN VĂN HỌC</div>
          <div class="study-main-quote" id="study-quote">“Văn học là nhân học.”</div>
          <div class="study-quote-author" id="study-author">— M. Gorki —</div>
        </div>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="card lb-card">
      <div class="lb-header-bar">
        <div class="lb-title-wrap">
          <span class="lb-trophy-icon">
            <ion-icon name="trophy-outline"></ion-icon>
          </span>
          <div>
            <h2 class="lb-heading">Bảng Vàng Thành Tích</h2>
            <p class="lb-subheading">Kết quả học tập qua các lượt làm bài</p>
          </div>
        </div>
        <div class="lb-filters">
          <div class="lb-search-wrap">
            <input id="lb-search" class="lb-search-input" placeholder="Tìm học sinh, lớp, bộ đề..." oninput="renderLeaderboard()">
          </div>
          <select id="lb-mode-filter" class="lb-mode-select" onchange="renderLeaderboard()" style="display:none;">
            <option value="">Tất cả kết quả</option>
          </select>
          <button class="btn gh sm lb-filter-reset" onclick="resetLbFilters()" title="Xóa bộ lọc tìm kiếm">
            <ion-icon name="close-circle-outline"></ion-icon> <span>Xóa lọc</span>
          </button>
          <button class="btn gh sm lb-filter-reset" onclick="R.home()" title="Làm mới bảng xếp hạng">
            <ion-icon name="refresh-outline"></ion-icon>
          </button>
        </div>
      </div>
      <div id="lb-container"></div>
    </div>
  </div>
</section>
