<!-- SCREEN 1: HOME -->
<section id="s-home" class="scr">
  <div class="wrap">
    <!-- HERO SHOWCASE: NHẬN ĐỊNH VĂN HỌC & TRUYỀN CẢM HỨNG -->
    <div class="hero-showcase" id="hero-showcase">
      <div class="hero-study-card" id="hero-study-card">
        <div class="study-card-img-wrap" id="study-img-wrap">
          <img class="study-card-img" id="study-img" src="./assets/gorki.jpg" alt="M. Gorki">
        </div>
        <div class="study-card-content" id="study-content">
          <div class="study-quote-tag" id="study-tag">LÝ LUẬN VĂN HỌC</div>
          <div class="study-main-quote" id="study-quote">“Văn học là nhân học.”</div>
          <div class="study-quote-author" id="study-author">— M. Gorki —</div>
        </div>
      </div>
    </div>

    <!-- GAMIFICATION & TIẾN TRÌNH HỌC TẬP -->
    <div class="home-enrichment-grid">
      <!-- 1. CƠ CHẾ GAMIFICATION: STREAK, PROGRESS BAR & BADGES -->
      <div class="card gami-home-card" id="home-gamification-card">
        <div class="gami-card-header">
          <div class="gami-title-group">
            <span class="gami-flame-badge" id="home-streak-flame">🔥</span>
            <div>
              <h3 class="gami-heading">Chuỗi <span id="home-streak-days">1</span> Ngày Học Liên Tục</h3>
              <p class="gami-subtitle" id="home-rank-title">Danh hiệu: Tân Sĩ Tử · 0 XP</p>
            </div>
          </div>
          <button class="btn au sm" type="button" onclick="openGamificationModal()">
            <ion-icon name="ribbon-outline"></ion-icon> <span>Huy hiệu (<span id="home-badges-unlocked-count">1/8</span>)</span>
          </button>
        </div>

        <!-- Thanh tiến trình XP & Mục tiêu ngày (Gộp 2 cột gọn gàng) -->
        <div class="gami-progress-section gami-progress-dual">
          <div class="gami-progress-col">
            <div class="gami-progress-labels">
              <span>Cấp độ (<span id="home-xp-current">0</span>/<span id="home-xp-next">100</span> XP)</span>
              <b id="home-xp-percent">0%</b>
            </div>
            <div class="gami-progress-track">
              <div class="gami-progress-fill" id="home-xp-bar" style="width: 15%;"></div>
            </div>
          </div>

          <div class="gami-progress-col">
            <div class="gami-progress-labels">
              <span>Mục tiêu ngày (<span id="home-daily-done">0</span>/3 bài)</span>
              <b id="home-daily-percent">0%</b>
            </div>
            <div class="gami-progress-track gami-daily-track">
              <div class="gami-progress-fill gami-daily-fill" id="home-daily-bar" style="width: 0%;"></div>
            </div>
          </div>
        </div>

        <!-- Lịch tuần 7 ngày -->
        <div class="gami-week-row" id="home-streak-week-row"></div>

        <!-- Dải huy hiệu nhanh -->
        <div class="gami-mini-badges-row" id="home-mini-badges-row"></div>
      </div>
    </div>


    <!-- LEADERBOARD -->
    <div class="card lb-card">
      <div class="lb-header-bar">
        <div class="lb-title-wrap">
          <span class="lb-trophy-icon">
            <ion-icon name="trophy-outline"></ion-icon>
          </span>
          <div>
            <h2 class="lb-heading">Bảng Vàng Thành Tích</h2>
            <p class="lb-subheading">Kết quả học tập qua các lượt làm bài</p>
          </div>
        </div>
        <div class="lb-filters">
          <div class="lb-search-wrap">
            <input id="lb-search" class="lb-search-input" placeholder="Tìm học sinh, lớp, bộ đề..." oninput="renderLeaderboard()">
          </div>
          <select id="lb-mode-filter" class="lb-mode-select" onchange="renderLeaderboard()" style="display:none;">
            <option value="">Tất cả kết quả</option>
          </select>
          <button class="btn gh sm lb-filter-reset" onclick="resetLbFilters()" title="Xóa bộ lọc tìm kiếm">
            <ion-icon name="close-circle-outline"></ion-icon> <span>Xóa lọc</span>
          </button>
          <button class="btn gh sm lb-filter-reset" onclick="R.home()" title="Làm mới bảng xếp hạng">
            <ion-icon name="refresh-outline"></ion-icon>
          </button>
        </div>
      </div>
      <div id="lb-container"></div>
    </div>
  </div>
</section>
