<!-- SCREEN: QUIZ HISTORY (LỊCH SỬ BÀI LÀM) -->
<section id="s-history" class="scr">
  <div class="wrap">
    <!-- Hero Banner -->
    <div class="cartoon-lib-banner history-hero-banner" style="margin-bottom:16px;">
      <div class="lib-banner-content">
        <h1 style="font-size:clamp(22px, 3.5vw, 28px); margin:0 0 4px; font-weight:800; display:flex; align-items:center; gap:8px;">
          <span>📜</span> <span>Lịch sử bài làm &amp; Tiến độ</span>
        </h1>
        <p class="mut" style="margin:0; font-size:14.5px;">
          Theo dõi kết quả làm bài, câu trả lời tự luận và tiến trình ôn tập
        </p>
      </div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span id="history-sync-badge-page" class="sync-badge" aria-live="polite">☁️ Đã đồng bộ</span>
        <button class="btn gh sm" type="button" onclick="loadQuizHistoryFromSupabase(true)" title="Tải lại từ Database Supabase" style="height:36px; padding:0 12px; font-weight:700;">
          🔄 Tải lại máy chủ
        </button>
      </div>
    </div>

    <!-- Quick Stats Overview Cards -->
    <div class="history-stats-grid" id="history-stats-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap:14px; margin-bottom:18px;">
      <div class="card" style="padding:16px 20px; display:flex; align-items:center; gap:14px; border-radius:18px;">
        <span style="font-size:32px;">🏆</span>
        <div>
          <span style="font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase;">Tổng lượt làm bài</span>
          <h3 id="stat-total-attempts" style="margin:2px 0 0; font-size:22px; font-weight:900;">0</h3>
        </div>
      </div>
      <div class="card" style="padding:16px 20px; display:flex; align-items:center; gap:14px; border-radius:18px;">
        <span style="font-size:32px;">🎯</span>
        <div>
          <span style="font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase;">Độ chính xác TB</span>
          <h3 id="stat-avg-accuracy" style="margin:2px 0 0; font-size:22px; font-weight:900;">0%</h3>
        </div>
      </div>
      <div class="card" style="padding:16px 20px; display:flex; align-items:center; gap:14px; border-radius:18px;">
        <span style="font-size:32px;">📝</span>
        <div>
          <span style="font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase;">Câu tự luận đã lưu</span>
          <h3 id="stat-total-saved-short" style="margin:2px 0 0; font-size:22px; font-weight:900;">0</h3>
        </div>
      </div>
      <div class="card" style="padding:16px 20px; display:flex; align-items:center; gap:14px; border-radius:18px;">
        <span style="font-size:32px;">⏱️</span>
        <div>
          <span style="font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase;">Tổng thời gian học</span>
          <h3 id="stat-total-time" style="margin:2px 0 0; font-size:22px; font-weight:900;">0p</h3>
        </div>
      </div>
    </div>

    <!-- Filter & Search Bar Card -->
    <div class="lib-search-filter-card" style="margin: 0 0 16px;">
      <div class="lib-search-bar-row" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <div class="lib-search-input-box" style="flex:1; min-width:240px;">
          <span class="lib-search-lead-icon">🔍</span>
          <input id="history-page-search" type="text" placeholder="Tìm kiếm theo tên học sinh, lớp, tác phẩm, chủ đề…" oninput="onHistoryPageSearchInput()" autocomplete="off">
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <select id="history-page-set-filter" onchange="onHistoryPageSetFilterChange()" style="height:46px; border-radius:14px; border:2px solid var(--stroke); padding:0 14px; font-weight:700; font-size:13.5px; background:var(--bg-card); color:var(--ink); min-width:200px; max-width:280px;" title="Lọc theo bộ câu hỏi">
            <option value="">📚 Tất cả bộ đề</option>
          </select>
          <button class="btn no sm" type="button" onclick="clearAllQuizHistory()" title="Xóa toàn bộ lịch sử trên máy" style="height:46px; padding:0 14px; font-weight:700; border-radius:14px;">
            🗑️ Xóa tất cả
          </button>
        </div>
      </div>

      <!-- Type Filter Chips (Tất cả / Bài học / Đọc hiểu) -->
      <div class="topic-filter-row" style="margin-top:12px;">
        <div class="topic-filter-meta">
          <span class="topic-filter-title">Loại bài làm:</span>
        </div>
        <div class="topic-chips-bar" role="tablist">
          <button class="topic-chip active" id="hist-chip-all" type="button" onclick="setHistoryTypeFilter('all')">
            Tất cả <span id="hist-count-all" class="chip-count">(0)</span>
          </button>
          <button class="topic-chip" id="hist-chip-quiz" type="button" onclick="setHistoryTypeFilter('quiz')">
            📖 Bài học <span id="hist-count-quiz" class="chip-count">(0)</span>
          </button>
          <button class="topic-chip" id="hist-chip-reading" type="button" onclick="setHistoryTypeFilter('reading')">
            📑 Đọc hiểu <span id="hist-count-reading" class="chip-count">(0)</span>
          </button>
          <button class="topic-chip" id="hist-chip-ungraded" type="button" onclick="setHistoryTypeFilter('ungraded')">
            ⏳ Chờ chấm <span id="hist-count-ungraded" class="chip-count">(0)</span>
          </button>
          <button class="topic-chip" id="hist-chip-graded" type="button" onclick="setHistoryTypeFilter('graded')">
            ✅ Đã chấm <span id="hist-count-graded" class="chip-count">(0)</span>
          </button>
        </div>
      </div>

      <!-- Active Set Filter Badge -->
      <div id="history-page-active-filter-badge" style="display:none; margin-top:12px; padding:8px 14px; background:rgba(217, 169, 79, 0.15); border:1.5px solid var(--gold); border-radius:12px; font-size:13.5px; font-weight:700; align-items:center; justify-content:space-between;">
        <span id="history-page-filter-badge-text"></span>
        <button class="btn gh sm" type="button" onclick="clearHistoryPageSetFilter()" style="padding:2px 10px; font-size:12.5px; height:28px;">✕ Xem tất cả bộ đề</button>
      </div>
    </div>

    <!-- History Items Container -->
    <div id="history-page-list-container" class="history-list-wrap">
      <!-- Rendered by JS -->
    </div>
  </div>
</section>
