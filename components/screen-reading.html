<!-- SCREEN: READING COMPREHENSION (ĐỌC HIỂU NGỮ VĂN) -->
<section id="s-reading" class="scr">
  <div class="wrap reading-wrap">

    <!-- VIEW 1: DANH SÁCH BỘ ĐỀ ĐỌC HIỂU -->
    <div id="reading-list-view">
      <!-- Cartoon Hero Banner -->
      <div class="reading-hero-banner">
        <div class="reading-hero-content">
          <h1 style="font-size:clamp(22px, 3.5vw, 28px); margin:0 0 4px; font-weight:800;">Luyện Đọc hiểu Ngữ Văn</h1>
          <p class="reading-hero-desc">Rèn luyện kỹ năng đọc hiểu văn bản, nhận diện phương thức biểu đạt, biện pháp nghệ thuật và phát triển tư duy phản biện.</p>
        </div>
      </div>

      <!-- Action & Filters Bar -->
      <div class="reading-control-bar card">
        <div class="reading-control-top">
          <div class="reading-search-box">
            <span class="reading-search-icon">🔍</span>
            <input type="text" id="reading-search-input" placeholder="Tìm kiếm bộ đề đọc hiểu theo tên bài, tác giả hoặc thể loại..." oninput="onReadingSearchInput()">
          </div>
        </div>

        <div class="reading-category-filter">
          <div class="reading-filter-chips-wrap">
            <span class="reading-filter-label">Chủ đề:</span>
            <div class="reading-category-chips" id="reading-category-chips"></div>
          </div>
          <div class="reading-category-actions">
            <button class="btn cy sm" type="button" onclick="promptAddNewReadingCategory()" title="Tạo thêm chủ đề mới">
              + Thêm chủ đề
            </button>
            <button class="btn no sm" type="button" onclick="promptDeleteCurrentReadingCategory()" title="Xóa chủ đề">
              ✕ Xóa chủ đề
            </button>
            <button class="btn au sm" type="button" onclick="openCreateReadingSetModal()" title="Tạo đề đọc hiểu mới">
              + Thêm đề mới
            </button>
          </div>
        </div>
      </div>

      <!-- Container danh sách các bộ đề đọc hiểu (sắp xếp theo chủ đề) -->
      <div id="reading-sets-container"></div>
    </div>

    <!-- VIEW 2: PHÒNG ĐỌC HIỂU & LÀM BÀI (SPLIT SCREEN WORKSPACE) -->
    <div id="reading-workspace-view" style="display:none;">
      <!-- Workspace Navigation Bar -->
      <div class="reading-workspace-nav">
        <button class="btn gh sm" onclick="exitReadingWorkspace()">
          <span>←</span> <span>Trở về danh sách đề</span>
        </button>
        <div class="reading-workspace-title-box">
          <h3 id="reading-workspace-set-title">Đề bài đọc hiểu</h3>
          <span id="reading-workspace-set-badge" class="tag cy">Thơ hiện đại</span>
        </div>
        <div class="reading-workspace-actions">
          <button class="btn gh sm" onclick="toggleReadingAnswersGuide()" id="btn-toggle-reading-answers" title="Bật/Tắt hiển thị đáp án gợi ý">
            <span>💡</span> <span>Xem gợi ý đáp án</span>
          </button>
          <button class="btn gh sm" onclick="resetCurrentReadingDraft()" title="Xóa toàn bộ câu trả lời để làm lại từ đầu">
            <span>🔄</span> <span>Làm lại</span>
          </button>
          <button class="btn cy sm" onclick="openEditReadingSetModal(window.currentReadingSetId || currentReadingSetId)" title="Chỉnh sửa đề bài này">
            <span>✏️</span> <span>Sửa đề</span>
          </button>
          <button class="btn no sm" onclick="deleteCurrentOpenedReadingSet()" title="Xóa đề này khỏi danh sách">
            <span>🗑️</span> <span>Xóa đề</span>
          </button>
          <button class="btn au sm" onclick="submitReadingAnswers()" title="Nộp bài và xem đánh giá chi tiết">
            <span>✅</span> <span>Nộp bài làm</span>
          </button>
        </div>
      </div>

      <!-- Split Layout Container -->
      <div class="reading-split-container" id="reading-split-container">
        <!-- Cột trái: Văn bản / Ngữ liệu đọc hiểu -->
        <div class="reading-passage-panel card">
          <div class="reading-panel-header">
            <div class="reading-panel-title">
              <span class="reading-panel-icon">📜</span>
              <h4>I. PHẦN ĐỌC HIỂU (3,0 điểm)</h4>
            </div>
            <div class="reading-text-tools">
              <button class="btn gh sm btn-icon-only" type="button" onclick="changePassageFontSize(-1)" title="Giảm cỡ chữ">A-</button>
              <button class="btn gh sm btn-icon-only" type="button" onclick="changePassageFontSize(1)" title="Tăng cỡ chữ">A+</button>
            </div>
          </div>
          
          <div class="reading-passage-content-wrap" id="reading-passage-scroll">
            <div class="reading-passage-meta" id="reading-passage-meta">
              <span class="reading-meta-tag" id="reading-passage-genre"></span>
              <span class="reading-meta-author" id="reading-passage-author"></span>
              <span class="reading-meta-work" id="reading-passage-work" style="display:none;"></span>
            </div>
            <div class="reading-passage-lead-text"><b>Đọc đoạn trích:</b></div>
            <article class="reading-passage-body" id="reading-passage-text">
              <!-- Nội dung văn bản đọc hiểu -->
            </article>
            <div class="reading-passage-source" id="reading-passage-source">
              <!-- Nguồn trích dẫn -->
            </div>
          </div>
        </div>

        <!-- Cột phải: Hệ thống câu hỏi & Trả lời -->
        <div class="reading-questions-panel card">
          <div class="reading-panel-header">
            <div class="reading-panel-title">
              <span class="reading-panel-icon">✍️</span>
              <h4>Thực hiện các yêu cầu sau: (<span id="reading-q-count">0</span> câu)</h4>
            </div>
            <span class="reading-save-status" id="reading-save-status">💾 Tự động lưu</span>
          </div>

          <div class="reading-questions-list" id="reading-questions-list">
            <!-- Danh sách câu hỏi render bởi JS -->
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
