<!-- SCREEN 5: RESULTS -->
<section id="s-res" class="scr">
  <div class="wrap">
    <div class="hero">
      <h1 id="rt">Kết quả bài làm</h1>
      <p id="rn" class="mut" style="font-size:18px;"></p>
    </div>
    <div class="card" style="text-align:center;">
      <p id="score-save-status" role="status" aria-live="polite" style="margin:0 0 10px;">Đang lưu kết quả bảng xếp hạng...</p>
      <button class="btn gh sm" id="score-save-retry" onclick="saveScoreToLeaderboard()" hidden>
        <ion-icon name="refresh-outline"></ion-icon> Thử lưu lại
      </button>
    </div>
    <div class="g3" id="rs" style="margin-bottom:24px;"></div>

    <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
      <button class="btn au" onclick="replay()">
        <ion-icon name="refresh-outline"></ion-icon> Làm lại
      </button>
      <button class="btn cy" onclick="go('history')">
        <ion-icon name="time-outline"></ion-icon> Xem lịch sử bài làm
      </button>
      <button class="btn gh" onclick="go('setup')">
        <ion-icon name="book-outline"></ion-icon> Chọn bộ khác
      </button>
      <button class="btn gh" onclick="go('home')">
        <ion-icon name="home-outline"></ion-icon> Trang chủ
      </button>
    </div>

    <h2 style="margin-top:32px;">Chi tiết từng câu hỏi</h2>
    <div id="rv"></div>
  </div>
</section>
